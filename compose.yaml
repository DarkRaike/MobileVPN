services:
  app:
    build:
      context: .
      target: development
    init: true
    environment:
      DATABASE_URL: /data/astra-vpn.sqlite
      ENABLE_DEV_MOCK_AUTH: ${ENABLE_DEV_MOCK_AUTH:-false}
      NODE_ENV: development
      ORIGIN: http://localhost:5173
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: ${TELEGRAM_INIT_DATA_MAX_AGE_SECONDS:-300}
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
      - app-data:/data
    command:
      - sh
      - -c
      - npm run db:migrate && npm run dev -- --host 0.0.0.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  app-data:
  app-node-modules:
