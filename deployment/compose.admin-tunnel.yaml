# Temporary override that publishes the Marzban dashboard on loopback only.
# Marzban listens on a Unix socket, so the reverse proxy exposes it. Use the
# override together with an SSH tunnel and remove it once the session is over:
#
#   docker compose --env-file deployment/production.env \
#     -f deployment/compose.production.yaml \
#     -f deployment/compose.admin-tunnel.yaml up -d reverse-proxy
#   ssh -N -L 8000:127.0.0.1:8000 operator@vps
#
# The dashboard is never exposed publicly; on the subscription host Caddy
# answers 404 for /dashboard/*.
services:
  reverse-proxy:
    ports:
      - "127.0.0.1:8000:8000"
