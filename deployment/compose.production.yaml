name: astra-vpn

x-application-build: &application-build
  context: ..
  dockerfile: Dockerfile
  target: production

x-bootstrap-mounts: &bootstrap-mounts
  - ./bootstrap:/run/astra/bootstrap:ro
  - ${DEPLOY_SECRET_DIRECTORY:-./secrets}:/run/astra/secrets:ro

x-marzban-image: &marzban-image gozargah/marzban:v0.8.4@sha256:8e422c21997e5d2e3fa231eeff73c0a19193c20fc02fa4958e9368abb9623b8d

services:
  bootstrap:
    image: *marzban-image
    init: true
    environment:
      ALERT_REPEAT_MILLISECONDS: ${ALERT_REPEAT_MILLISECONDS:-1800000}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      APP_GID: ${APP_GID:-1000}
      APP_UID: ${APP_UID:-1000}
      BASE_DOMAIN: ${BASE_DOMAIN:?Set BASE_DOMAIN}
      ENABLE_LIVE_OPERATIONS: ${ENABLE_LIVE_OPERATIONS:-false}
      MARZBAN_USERNAME: ${MARZBAN_USERNAME:-astra_admin}
      MARZBAN_VLESS_INBOUND_TAG: "${MARZBAN_VLESS_INBOUND_TAG:-VLESS WS}"
      VPN_HOST: ${VPN_HOST:-}
      MONITORING_INTERVAL_MILLISECONDS: ${MONITORING_INTERVAL_MILLISECONDS:-60000}
      PYTHONDONTWRITEBYTECODE: "1"
      RECONCILIATION_INTERVAL_MILLISECONDS: ${RECONCILIATION_INTERVAL_MILLISECONDS:-30000}
      TELEGRAM_ADMIN_USER_ID: ${TELEGRAM_ADMIN_USER_ID:?Set TELEGRAM_ADMIN_USER_ID}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
      TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: ${TELEGRAM_INIT_DATA_MAX_AGE_SECONDS:-300}
      XRAY_EXECUTABLE_PATH: ${XRAY_EXECUTABLE_PATH:-}
      XRAY_LOG_LEVEL: ${XRAY_LOG_LEVEL:-warning}
    command:
      - python3
      - /run/astra/bootstrap/bootstrap.py
    network_mode: none
    volumes:
      - ./bootstrap:/run/astra/bootstrap:ro
      - ./xray:/run/astra/templates:ro
      - ./xray/bin:/opt/xray:ro
      - ${DEPLOY_SECRET_DIRECTORY:-./secrets}:/run/astra/secrets
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    # Generated application env files are handed to the unprivileged app user,
    # which a root process without CAP_CHOWN cannot do.
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    restart: "no"

  marzban-init:
    image: *marzban-image
    init: true
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    working_dir: /code
    entrypoint:
      - /bin/sh
      - /run/astra/bootstrap/with-env.sh
      - /run/astra/secrets/marzban-init.env
    command:
      - sh
      - /run/astra/bootstrap/marzban-init.sh
    network_mode: none
    volumes:
      - marzban-data:/var/lib/marzban
      - ./bootstrap:/run/astra/bootstrap:ro
      # Importing the Marzban package executes the configured Xray binary, so
      # this one-shot needs the same core the panel will run.
      - ./xray/bin:/opt/xray:ro
      - ${DEPLOY_SECRET_DIRECTORY:-./secrets}:/run/astra/secrets:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  app-init:
    image: astra-vpn-app:${RELEASE_VERSION:?Set RELEASE_VERSION}
    build: *application-build
    init: true
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      BACKUP_STATUS_FILE: /ops/backup-status.json
      DATABASE_URL: /data/astra-vpn.sqlite
      MARZBAN_BASE_URL: http://marzban:8000
      NODE_ENV: production
      ORIGIN: https://app.${BASE_DOMAIN:?Set BASE_DOMAIN}
    entrypoint:
      - /bin/sh
      - /run/astra/bootstrap/with-env.sh
      - /run/astra/secrets/app.env
    command:
      - node
      - scripts/seed.mjs
    network_mode: none
    volumes:
      - app-data:/data
      - ./bootstrap:/run/astra/bootstrap:ro
      - ${DEPLOY_SECRET_DIRECTORY:-./secrets}:/run/astra/secrets:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  reverse-proxy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    depends_on:
      app:
        condition: service_healthy
      marzban:
        condition: service_healthy
    environment:
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
      BASE_DOMAIN: ${BASE_DOMAIN:?Set BASE_DOMAIN}
    # The tunnel path is generated, so it reaches Caddy the same way every other
    # generated value reaches its service.
    entrypoint:
      - /bin/sh
      - /run/astra/bootstrap/with-env.sh
      - /run/astra/secrets/caddy.env
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile
      - --adapter
      - caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      backend:
        # The application reaches the Marzban API at http://marzban:8000 through
        # this proxy, which forwards to the Marzban Unix socket.
        aliases:
          - marzban
      edge: {}
      # Caddy forwards the tunnel path to Xray, so the two share a network.
      vpn-egress: {}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./bootstrap:/run/astra/bootstrap:ro
      - ${DEPLOY_SECRET_DIRECTORY:-./secrets}:/run/astra/secrets:ro
      - caddy-data:/data
      - marzban-socket:/run/marzban
    read_only: true
    tmpfs:
      - /config
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "caddy",
          "validate",
          "--config",
          "/etc/caddy/Caddyfile",
          "--adapter",
          "caddyfile",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  app:
    image: astra-vpn-app:${RELEASE_VERSION:?Set RELEASE_VERSION}
    build: *application-build
    init: true
    depends_on:
      app-init:
        condition: service_completed_successfully
    environment:
      ADDRESS_HEADER: X-Forwarded-For
      BACKUP_STATUS_FILE: /ops/backup-status.json
      BODY_SIZE_LIMIT: 64K
      DATABASE_URL: /data/astra-vpn.sqlite
      HOST: 0.0.0.0
      HOST_HEADER: X-Forwarded-Host
      MARZBAN_BASE_URL: http://marzban:8000
      NODE_ENV: production
      ORIGIN: https://app.${BASE_DOMAIN:?Set BASE_DOMAIN}
      PORT: 3000
      PROTOCOL_HEADER: X-Forwarded-Proto
      XFF_DEPTH: 1
    entrypoint:
      - /bin/sh
      - /run/astra/bootstrap/with-env.sh
      - /run/astra/secrets/app.env
    command:
      - node
      - build
    expose:
      - "3000"
    networks:
      - backend
      - telegram-egress
    volumes:
      - app-data:/data
      - operations-state:/ops:ro
      - ./bootstrap:/run/astra/bootstrap:ro
      - ${DEPLOY_SECRET_DIRECTORY:-./secrets}:/run/astra/secrets:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker:
    image: astra-vpn-app:${RELEASE_VERSION:?Set RELEASE_VERSION}
    build: *application-build
    init: true
    depends_on:
      app:
        condition: service_healthy
      marzban:
        condition: service_healthy
      reverse-proxy:
        condition: service_healthy
    environment:
      INTERNAL_JOB_URL: http://app:3000/api/internal/jobs/reconcile
      NODE_ENV: production
    entrypoint:
      - /bin/sh
      - /run/astra/bootstrap/with-env.sh
      - /run/astra/secrets/worker.env
    command:
      - node
      - scripts/reconciliation-worker.mjs
    networks:
      - backend
    volumes: *bootstrap-mounts
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        ["CMD", "node", "-e", "try{process.kill(1,0)}catch{process.exit(1)}"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  monitoring:
    image: astra-vpn-app:${RELEASE_VERSION:?Set RELEASE_VERSION}
    build: *application-build
    init: true
    depends_on:
      app:
        condition: service_healthy
    environment:
      MONITORING_API_URL: http://app:3000/api/internal/monitoring
      NODE_ENV: production
    entrypoint:
      - /bin/sh
      - /run/astra/bootstrap/with-env.sh
      - /run/astra/secrets/monitoring.env
    command:
      - node
      - scripts/monitoring-worker.mjs
    networks:
      - backend
      - telegram-egress
    volumes: *bootstrap-mounts
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        ["CMD", "node", "-e", "try{process.kill(1,0)}catch{process.exit(1)}"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  marzban:
    image: *marzban-image
    init: true
    depends_on:
      marzban-init:
        condition: service_completed_successfully
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    working_dir: /code
    entrypoint:
      - /bin/sh
      - /run/astra/bootstrap/with-env.sh
      - /run/astra/secrets/marzban.env
    command:
      - sh
      - /run/astra/bootstrap/marzban-run.sh
    # Nothing is published: the tunnel arrives from Caddy over the private
    # network, and the API only through the reverse proxy.
    expose:
      - "2096"
    networks:
      vpn-egress:
        # `marzban` already belongs to the reverse proxy on the backend network.
        aliases:
          - xray
    volumes:
      - marzban-data:/var/lib/marzban
      - marzban-socket:/run/marzban
      - ./bootstrap:/run/astra/bootstrap:ro
      # An operator supplied core lands here. Empty by default, in which case
      # the binary from the image is used and this mount does nothing.
      - ./xray/bin:/opt/xray:ro
      - ${DEPLOY_SECRET_DIRECTORY:-./secrets}:/run/astra/secrets:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import socket;s=socket.socket(socket.AF_UNIX);s.settimeout(3);s.connect('/run/marzban/uvicorn.sock');s.close()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  telegram-webhook:
    image: astra-vpn-app:${RELEASE_VERSION:?Set RELEASE_VERSION}
    build: *application-build
    init: true
    profiles:
      - telegram
    environment:
      NODE_ENV: production
    entrypoint:
      - /bin/sh
      - /run/astra/bootstrap/with-env.sh
      - /run/astra/secrets/app.env
    command:
      - node
      - scripts/telegram-setup.mjs
    networks:
      - telegram-egress
    volumes: *bootstrap-mounts
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  backup:
    image: astra-vpn-operations:${RELEASE_VERSION:?Set RELEASE_VERSION}
    build:
      context: ..
      dockerfile: Dockerfile
      target: operations
    init: true
    profiles:
      - backup
    depends_on:
      app:
        condition: service_healthy
      marzban:
        condition: service_healthy
    env_file:
      - path: ./backup.env
        required: false
    environment:
      APP_DATABASE_PATH: /source/app/astra-vpn.sqlite
      BACKUP_PUBLIC_INCLUDE_PATHS_JSON: '["/app/drizzle","/app/deployment"]'
      BACKUP_SECRET_PATHS_JSON: '["/source/secrets"]'
      BACKUP_STATUS_FILE: /ops/backup-status.json
      BACKUP_WORK_DIRECTORY: /work
      MARZBAN_DATABASE_PATH: /source/marzban/db.sqlite3
      RELEASE_VERSION: ${RELEASE_VERSION:?Set RELEASE_VERSION}
      RESTIC_PASSWORD_FILE: /source/secrets/restic_password
      RESTORE_LIVE_PATHS_JSON: '["/source/app","/source/marzban","/ops"]'
    networks:
      - backup-egress
    volumes:
      - app-data:/source/app:ro
      - marzban-data:/source/marzban:ro
      - operations-state:/ops
      - backup-work:/work
      - ${DEPLOY_SECRET_DIRECTORY:-./secrets}:/source/secrets:ro
    read_only: true
    tmpfs:
      - /tmp
    user: "0:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import json,time;p=json.load(open('/ops/backup-status.json'));assert time.time()-__import__('datetime').datetime.fromisoformat(p['lastSuccessAt'].replace('Z','+00:00')).timestamp()<3900",
        ]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 70m
    restart: unless-stopped

# Docker gives every bridge an MTU of 1500, so a container advertises MSS 1460
# and sends full size packets. A host whose real path MTU is lower drops them
# silently, and because the ICMP that should report it does not come back, the
# connection does not fail — it stalls. Small packets keep flowing, which is why
# a TCP handshake completes and the TLS ServerHello behind it never arrives.
#
# Measure before changing this: `ping -c1 -M do -s <size> <host>` from the VPS,
# where the packet is `size + 28`. The value below has to fit the smallest path
# the server actually uses, including the one to its own clients.
networks:
  backend:
    internal: true
  backup-egress:
    driver_opts: &network-mtu
      com.docker.network.driver.mtu: ${DOCKER_NETWORK_MTU:-1400}
  edge:
    driver_opts: *network-mtu
  telegram-egress:
    driver_opts: *network-mtu
  vpn-egress:
    driver_opts: *network-mtu

volumes:
  app-data:
  backup-work:
  caddy-data:
  marzban-data:
  marzban-socket:
  operations-state:
